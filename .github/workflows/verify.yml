
name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pip_audit -r requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        env:
          TTX_DATA_DIR: ${{ runner.temp }}/ttx
        run: |
          export TTX_TEST_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          python -m pip install -r ../backend/requirements.txt
          (cd ../backend && TTX_SETUP_PASSWORD="$TTX_TEST_PASSWORD" python -m app.demo seed)
          (cd ../backend && python -m uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          npm run dev &
          trap 'kill $(jobs -p) 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl -fs http://127.0.0.1:5173/api/v1/health; then break; fi
            sleep 0.5
          done
          curl -fs http://127.0.0.1:5173/api/v1/health
          npm test
